<title>RAG 근거 라벨 검수</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* 레이아웃: 상단 고정 쿼리 바 + 후보 카드 한 줄 목록. 검수 도구라 장식 없이 상태(판정/저장)만 색으로 구분 */
:root{
  --bg:#f6f7f9;--card:#ffffff;--fg:#1d232b;--muted:#66707d;--line:#dde2e8;
  --accent:#2b5fd9;--accent-fg:#ffffff;--hit:#fff1c2;--hit-line:#d99a00;--ok:#1f8a4c;--no:#c4382f;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b;--card:#1a2027;--fg:#e8ecf1;--muted:#9aa5b1;--line:#2a323c;
  --accent:#7aa2ff;--accent-fg:#0d1420;--hit:#3d3210;--hit-line:#e0b23a;--ok:#5fd18f;--no:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b;--card:#1a2027;--fg:#e8ecf1;--muted:#9aa5b1;--line:#2a323c;
  --accent:#7aa2ff;--accent-fg:#0d1420;--hit:#3d3210;--hit-line:#e0b23a;--ok:#5fd18f;--no:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--font-body);padding-inline:16px}
main{max-width:860px;margin:0 auto;padding-block:8px 32px;display:grid;gap:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);z-index:1;display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--font-mono);font-size:12px}
#progress{font-variant-numeric:tabular-nums}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,.sent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%;min-width:0}
#qtext{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.card.done-yes{border-color:var(--ok)}
.card.done-no{border-color:var(--no)}
.card p{margin:0;overflow-wrap:anywhere}
.sent{cursor:pointer;border-radius:3px;padding:1px 2px}
.sent.on{background:var(--hit);box-shadow:inset 0 -2px 0 var(--hit-line)}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.saved-yes{color:var(--ok)}.saved-no{color:var(--no)}
#banner{padding:8px 12px;border-radius:8px;border:1px solid var(--no);color:var(--no)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<main>
  <header>
    <div class="row">
      <select id="qsel" aria-label="검색 쿼리 선택"></select>
      <button id="prev" type="button">이전</button>
      <button id="next" type="button">다음</button>
      <button id="nextTodo" type="button">다음 미검수</button>
      <span class="muted" id="progress">불러오는 중…</span>
    </div>
    <div id="banner" hidden></div>
  </header>
  <h1 id="qtext">검수 항목을 불러오는 중입니다</h1>
  <div class="row muted mono" id="qmeta"></div>
  <div class="row" id="qedit"></div>
  <div id="cards" style="display:grid;gap:12px"></div>
  <p class="muted">문장을 눌러 근거를 선택하거나 해제하세요. "관련 있음"은 근거 문장을 하나 이상 골라야 저장됩니다.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { items: [], idx: 0, decisions: new Map(), queryEdits: new Map(), selected: new Map(), db: null };
const compact = (s) => s.normalize("NFC").replace(/\s+/g, "");
const decisionId = (qid, hash) => `${qid}__${hash.slice(0, 16)}`;
const sentences = (text) => text.split(/(?<=[.!?。])\s+|\n+/).map((s) => s.trim()).filter(Boolean);

function overlaps(sentence, evidence) {
  const s = compact(sentence);
  return evidence.some((e) => { const c = compact(e); return c && (s.includes(c) || c.includes(s)); });
}

function selectionFor(q, c) {
  const key = decisionId(q.query_id, c.content_hash);
  if (!state.selected.has(key)) {
    const saved = state.decisions.get(key);
    const evidence = saved ? saved.evidence : c.judged_evidence;
    const sents = sentences(c.content);
    state.selected.set(key, new Set(sents.map((s, i) => (overlaps(s, evidence) ? i : -1)).filter((i) => i >= 0)));
  }
  return state.selected.get(key);
}

function el(tag, props, ...children) {
  const node = Object.assign(document.createElement(tag), props || {});
  node.append(...children);
  return node;
}

function render() {
  const q = state.items[state.idx];
  if (!q) return;
  $("qsel").value = String(state.idx);
  const edit = state.queryEdits.get(q.query_id) || {};
  $("qtext").textContent = edit.text || q.text;
  $("qmeta").textContent = `${q.query_id} · ${q.form} · ${q.split}${edit.excluded ? " · 제외됨" : ""}`;

  const qedit = $("qedit");
  qedit.replaceChildren();
  if (q.form === "question") {
    const input = el("input", { type: "text", id: "question-edit", value: edit.text || q.text, size: 40 });
    const save = el("button", { type: "button", textContent: "질문 저장", disabled: !state.db });
    save.onclick = () => saveQuery(q, { text: input.value.trim() || null, excluded: !!edit.excluded });
    qedit.append(input, save);
  }
  const ex = el("button", { type: "button", textContent: edit.excluded ? "제외 취소" : "이 쿼리 제외", disabled: !state.db });
  ex.onclick = () => saveQuery(q, { text: edit.text || null, excluded: !edit.excluded });
  qedit.append(ex);

  const cards = $("cards");
  cards.replaceChildren();
  q.candidates.forEach((c, n) => {
    const key = decisionId(q.query_id, c.content_hash);
    const saved = state.decisions.get(key);
    const judged = c.judged_relevant === null ? "미판정" : c.judged_relevant ? "관련 있음" : "관련 없음";
    const head = el("div", { className: "row muted" },
      `후보 ${n + 1}/${q.candidates.length} · ${c.title}${c.heading_path ? " › " + c.heading_path : ""} · p.${c.page_start}`,
      el("span", { className: "badge", textContent: `Gemini: ${judged}` }));
    const sel = selectionFor(q, c);
    const body = el("p");
    sentences(c.content).forEach((s, i) => {
      const span = el("span", { className: "sent" + (sel.has(i) ? " on" : ""), textContent: s, tabIndex: 0 });
      span.setAttribute("role", "button");
      span.setAttribute("aria-pressed", String(sel.has(i)));
      const toggle = () => { sel.has(i) ? sel.delete(i) : sel.add(i); render(); };
      span.onclick = toggle;
      span.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
      body.append(span, " ");
    });
    const yes = el("button", { type: "button", className: "primary", textContent: "관련 있음 (근거 저장)" });
    yes.disabled = sel.size === 0 || !state.db;
    yes.onclick = () => saveDecision(q, c, true);
    const no = el("button", { type: "button", textContent: "관련 없음", disabled: !state.db });
    no.onclick = () => saveDecision(q, c, false);
    const actions = el("div", { className: "row" }, yes, no);
    if (saved) actions.append(el("span", {
      className: saved.relevant ? "saved-yes" : "saved-no",
      textContent: saved.relevant ? "저장됨: 관련 있음" : "저장됨: 관련 없음",
    }));
    cards.append(el("div", { className: "card" + (saved ? (saved.relevant ? " done-yes" : " done-no") : "") }, head, body, actions));
  });
  renderProgress();
}

function renderProgress() {
  const total = state.items.reduce((n, q) => n + q.candidates.length, 0);
  $("progress").textContent = `검수 ${state.decisions.size} / ${total}`;
  [...$("qsel").options].forEach((o, i) => {
    const q = state.items[i];
    const done = q.candidates.every((c) => state.decisions.has(decisionId(q.query_id, c.content_hash)));
    o.textContent = `${done ? "✓" : "·"} ${q.query_id}`;
  });
}

function showError(message) { $("banner").hidden = false; $("banner").textContent = message; }

async function saveDecision(q, c, relevant) {
  const key = decisionId(q.query_id, c.content_hash);
  const sents = sentences(c.content);
  const evidence = relevant ? [...selectionFor(q, c)].sort((a, b) => a - b).map((i) => sents[i]) : [];
  try {
    await state.db.doc(`decisions/${key}`).set({ query_id: q.query_id, content_hash: c.content_hash, relevant, evidence, reviewed_at: new Date().toISOString() });
  } catch (e) { showError(`저장하지 못했습니다 (${e.code || e}). 잠시 후 다시 눌러 주세요.`); }
}

async function saveQuery(q, edit) {
  try {
    await state.db.doc(`queries/${q.query_id}`).set({ query_id: q.query_id, text: edit.text, excluded: edit.excluded });
  } catch (e) { showError(`저장하지 못했습니다 (${e.code || e}).`); }
}

function go(i) { state.idx = Math.max(0, Math.min(state.items.length - 1, i)); render(); window.scrollTo(0, 0); }
$("prev").onclick = () => go(state.idx - 1);
$("next").onclick = () => go(state.idx + 1);
$("nextTodo").onclick = () => {
  const n = state.items.length;
  for (let k = 1; k <= n; k++) {
    const i = (state.idx + k) % n, q = state.items[i];
    if (q.candidates.some((c) => !state.decisions.has(decisionId(q.query_id, c.content_hash)))) return go(i);
  }
};
$("qsel").onchange = (e) => go(Number(e.target.value));

(async () => {
  try {
    const res = await fetch("review_items.json");
    state.items = (await res.json()).queries;
  } catch (e) {
    $("qtext").textContent = "검수 항목 파일을 읽지 못했습니다";
    showError("review_items.json을 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
    return;
  }
  $("qsel").replaceChildren(...state.items.map((q, i) => el("option", { value: String(i), textContent: q.query_id })));
  render();
  const db = window.claude ? await window.claude.use("db") : null;
  if (!db) { showError("저장소에 연결할 수 없어 읽기 전용으로 열렸습니다. claude.ai에 로그인한 상태로 열어 주세요."); render(); return; }
  state.db = db;
  db.collection("decisions").onSnapshot((snap) => {
    state.decisions = new Map(snap.docs.map((d) => [d.id, d.data()]));
    for (const key of state.decisions.keys()) state.selected.delete(key);  // 저장된 근거로 선택 상태를 다시 맞춤
    render();
  }, (e) => showError(`실시간 연결이 끊겼습니다 (${e.code}). 새로고침해 주세요.`));
  db.collection("queries").onSnapshot((snap) => {
    state.queryEdits = new Map(snap.docs.map((d) => [d.id, d.data()]));
    render();
  }, (e) => showError(`실시간 연결이 끊겼습니다 (${e.code}). 새로고침해 주세요.`));
  render();
})();
</script>
